<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>F — Scene met pad</title>
<link rel="stylesheet" href="kaliber.css">
<style>
body{display:grid;place-items:center;min-height:100vh;padding:28px}
.sheet{width:min(900px,100%);background:var(--blackish);border:1px solid var(--green-400);border-radius:20px;padding:26px 30px}
h2{font-size:28px}
.sub{color:var(--gray-500);font-size:14px;margin:2px 0 20px}
.devices{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.device{background:var(--green-800);border:1px solid var(--green-400);border-radius:14px;padding:16px}
.device h3{font-size:18px;margin-bottom:2px}
.device p{margin:0 0 14px;color:var(--gray-500);font-size:13px}
.swatches{display:flex;gap:8px;margin-bottom:14px}
.sw{width:32px;height:32px;border-radius:9px;border:2px solid transparent}
.sw.aan{border-color:var(--berry)}
.slider{height:8px;border-radius:999px;background:linear-gradient(90deg,var(--green-300),var(--isit-green));position:relative;margin:16px 0 8px}
.knob{position:absolute;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--berry)}
.row{display:flex;justify-content:space-between;font-size:13px;color:var(--gray-500)}
.toggle{width:48px;height:27px;background:var(--green-300);border-radius:999px;position:relative}
.toggle i{position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:var(--berry)}
.start{margin-top:20px;background:var(--green-800);border:1px solid var(--green-400);border-radius:14px;padding:16px 18px}
.start h3{font-size:17px;margin-bottom:10px}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.opt{display:flex;gap:9px;align-items:center;border:1px solid var(--green-300);border-radius:11px;padding:10px 14px;font-size:14px;color:var(--gray-500)}
.opt.aan{border-color:var(--isit-green);color:var(--berry)}
.opt b{font-weight:450;color:var(--berry)}
.check{width:17px;height:17px;border-radius:5px;border:1px solid var(--green-300)}
.opt.aan .check{background:var(--isit-green);border-color:var(--isit-green)}
.key{font-family:'SF Mono',monospace;font-size:12px;color:var(--gray-500);background:#ffffff08;border:1px solid var(--green-300);border-radius:7px;padding:4px 9px}
.foot{display:flex;gap:10px;margin-top:20px;align-items:center}
button{background:transparent;border:1px solid var(--green-300);color:var(--berry);border-radius:999px;padding:9px 18px;font-size:14px;cursor:pointer}
button.p{background:var(--isit-green);border-color:var(--isit-green);color:var(--green-800);font-weight:500}
.spacer{margin-left:auto}
</style></head><body>
<div class="sheet">
  <h2>Shoutouts</h2><div class="sub">Licht voor het shoutouts-blok</div>
  <div class="devices">
    <div class="device"><h3>Spot</h3><p>warm licht vooraan</p>
      <div class="swatches"><div class="sw" style="background:#f3d2a7"></div><div class="sw" style="background:#fffcf2"></div><div class="sw" style="background:#bcd4ff"></div></div>
      <div class="slider"><div class="knob" style="left:0%"></div></div><div class="row"><span>helderheid</span><span>uit</span></div></div>
    <div class="device"><h3>Floods</h3><p>de drie grote lampen</p>
      <div class="swatches"><div class="sw aan" style="background:#e23b3b"></div><div class="sw" style="background:#00a1ff"></div><div class="sw" style="background:#d1ff00"></div><div class="sw" style="background:#dfa8ff"></div></div>
      <div class="slider"><div class="knob" style="left:96%"></div></div><div class="row"><span>helderheid</span><span>100%</span></div></div>
    <div class="device"><h3>Rookmachine</h3><p>blaast rook zolang hij aan staat</p>
      <div style="display:flex;gap:12px;align-items:center;margin-top:20px"><div class="toggle"><i></i></div><span style="color:var(--gray-500);font-size:13px">uit in deze scene</span></div></div>
  </div>
  <div class="start"><h3>Wanneer start deze scene?</h3>
    <div class="opts">
      <div class="opt aan"><span class="check"></span>Bij dia <b>34</b> <span class="key">#shoutouts</span></div>
      <div class="opt"><span class="check"></span>Alleen handmatig</div>
    </div>
  </div>
  <div class="foot"><span style="color:var(--gray-500);font-size:14px">overgang</span><button>1 sec</button><button style="border-color:var(--isit-green);color:var(--isit-green)">2 sec</button><button>5 sec</button>
    <span class="spacer"></span><button>Uitproberen</button><button class="p">Klaar</button></div>
</div>
</body></html>
