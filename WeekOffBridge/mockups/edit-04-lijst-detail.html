<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>04 — Lijst + detail</title>
<link rel="stylesheet" href="kaliber.css"><link rel="stylesheet" href="edit-shared.css">
<style>

.split{display:grid;grid-template-columns:260px 1fr;gap:0;height:100vh}
.lijst{border-right:1px solid var(--green-400);padding:20px 0;overflow:auto;background:var(--blackish)}
.lijst .kop{padding:0 20px}
.rijtje{display:flex;align-items:center;gap:11px;padding:10px 20px;cursor:pointer}
.rijtje:hover{background:#ffffff08}
.rijtje.sel{background:#ffffff10;box-shadow:inset 3px 0 0 var(--isit-green)}
.vlek{width:26px;height:26px;border-radius:8px;flex:none}
.rijtje small{display:block;color:var(--gray-500);font-size:12px}
.detail{padding:30px 34px;overflow:auto}

</style></head><body>
<span class="naam">04 · Lijst + detail</span>
<div class="split">
<div class="lijst">
<p class="kop">Scenes</p>
<div class="rijtje sel"><i class="vlek" style="background:#ffe9c9"></i><span>start<small>dia 1</small></span></div>
<div class="rijtje"><i class="vlek" style="background:#ffd9a0"></i><span>warm<small>dia 4–7</small></span></div>
<div class="rijtje"><i class="vlek disco"></i><span>disco<small>dia 8</small></span></div>
<div class="rijtje"><i class="vlek" style="background:#101c1c"></i><span>uit<small>dia 12</small></span></div>
<p class="kop" style="margin-top:22px">Pads</p>
<div class="rijtje"><i class="vlek" style="background:#2a3838"></i><span>Applaus<small>noot 44</small></span></div>
<div class="rijtje"><i class="vlek" style="background:#2a3838"></i><span>Curb<small>noot 46</small></span></div>
</div>
<div class="detail"><div class="ed">
  <div class="edhead"><h2>start</h2><span class="tag mono">#start</span><button class="close">✕</button></div>
  <p class="edsub">Dia 1 · 2 lampen · 2 sec overgang</p>
  <div class="edcols">
    <div class="fix">
      <div class="fixnaam">Spot <span class="mono">1–3</span></div>
      <div class="swrij"><i class="sw" style="background:#fffcf2"></i><i class="sw on" style="background:#ffe9c9"></i><i class="sw" style="background:#ffd9a0"></i><i class="sw" style="background:#9fd8ff"></i><i class="sw disco"></i><i class="sw uit"></i></div>
      <input type="range" value="74">
      <div class="rij"><span>helderheid</span><span>74%</span></div>
    </div>
    <div class="fix">
      <div class="fixnaam">Floods <span class="mono">4–6</span></div>
      <div class="swrij"><i class="sw" style="background:#e23b3b"></i><i class="sw" style="background:#d1ff00"></i><i class="sw on" style="background:#2fbf71"></i><i class="sw" style="background:#00a1ff"></i><i class="sw disco"></i><i class="sw uit"></i></div>
      <input type="range" value="95">
      <div class="rij"><span>helderheid</span><span>95%</span></div>
    </div>
  </div>
  <div class="edfoot"><button>Verwijderen</button><span class="sp"></span><button>Testen</button><button class="p">Klaar</button></div>
</div></div>
</div>
</body></html>
