<!doctype html><html lang="nl"><head><meta charset="utf-8"><title>18 &mdash; Stap voor stap</title>
<link rel="stylesheet" href="kaliber.css"><link rel="stylesheet" href="edit-shared.css">
<style>

.schim{position:fixed;inset:0;background:#000a;display:grid;place-items:center;padding:30px}
.dlg{width:min(660px,100%);background:var(--blackish);border:1px solid var(--green-400);border-radius:20px;padding:26px 30px}
.stappen{display:flex;gap:8px;margin-bottom:22px}
.st{flex:1;height:4px;border-radius:999px;background:var(--green-400);display:block}
.st.aan{background:var(--isit-green)}
.vraag{font-family:var(--font-display);font-size:27px;margin-bottom:6px}
.sub2{color:var(--gray-500);font-size:13px;margin-bottom:22px}
.groot{display:flex;gap:12px;flex-wrap:wrap}
.groot i{width:62px;height:62px;border-radius:16px;border:2px solid transparent;display:block;cursor:pointer}
.groot i.on{border-color:var(--pink)}

</style></head><body>
<span class="naam">18 &middot; Stap voor stap</span>
<div class="schim"><div class="dlg">
<div class="stappen"><i class="st aan"></i><i class="st aan"></i><i class="st"></i><i class="st"></i></div>
<div class="vraag">Welke kleur krijgt de Spot?</div>
<p class="sub2">Scene <b>start</b> &middot; stap 2 van 4</p>
<div class="groot"><i style="background:#fffcf2"></i><i class="on" style="background:#ffe9c9"></i><i style="background:#ffd9a0"></i><i style="background:#9fd8ff"></i><i class="disco"></i><i style="background:#101c1c;border-color:var(--green-300)"></i></div>
<div class="edfoot"><button>&larr; Terug</button><span class="sp"></span><button>Overslaan</button><button class="p">Volgende &rarr;</button></div>
</div></div>
</body></html>
